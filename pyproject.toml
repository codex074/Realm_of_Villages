[project]
name = "realm"
version = "0.1.0"
description = "Realm of Villages"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3",
    "alembic>=1.13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
realm = "realm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realm"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/delegate.py", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
