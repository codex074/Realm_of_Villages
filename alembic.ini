# Alembic configuration for Realm of Villages.
# The database URL is NOT hard-coded here; it is resolved at runtime by
# realm/db/migrations/env.py from the sqlalchemy.url option (if set) or from
# realm.settings.settings.database_url.

[alembic]
script_location = %(here)s/realm/db/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
